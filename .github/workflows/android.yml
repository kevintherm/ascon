name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]

defaults:
  run:
    working-directory: android

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The adblock engine is Rust, built for Android with cargo-ndk. Runners ship rustup.
      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk@4.1.2 --locked
      - name: Lint and test
        run: ./gradlew ktlintCheck detekt lint test -Proborazzi.test.verify=true assembleDebug

  adblock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/engine/adblock/rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  evaluator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/engine/detection
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/engine/detection/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Conformance in Chromium
        run: npm test
