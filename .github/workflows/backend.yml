name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Architecture
        run: go run github.com/fe3dback/go-arch-lint@v1.19.0 check
      - name: Test
        run: go test -race ./...
