version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests read fixture files by path on purpose.
      - path: _test\.go
        linters: [gosec]
        text: G304

formatters:
  enable:
    - gofmt
    - goimports
