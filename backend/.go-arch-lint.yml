version: 3
workdir: .

allow:
  depOnAnyVendor: false
  # Deep scan reports cmd/api handing adapters to use case constructors as
  # use cases depending on adapters. That injection is the point of the
  # domain interfaces, so only imports are checked.
  deepScan: false

components:
  domain:     { in: internal/domain/** }
  usecase:    { in: internal/usecase/** }
  adapter:    { in: internal/adapter/** }
  migrations: { in: migrations }
  cmd:        { in: cmd/** }

# Third-party packages. Only adapters may use them.
vendors:
  html:       { in: [golang.org/x/net/html, golang.org/x/net/idna] }
  cascadia:   { in: github.com/andybalholm/cascadia }
  jsonschema: { in: github.com/santhosh-tekuri/jsonschema/v6 }
  sqlite:     { in: modernc.org/sqlite }
  goose:      { in: github.com/pressly/goose/v3 }

# Dependencies point inward: adapter -> usecase -> domain.
deps:
  domain:
    mayDependOn: [domain]
  usecase:
    mayDependOn: [domain, usecase]
  adapter:
    mayDependOn: [domain, usecase, adapter, migrations]
    canUse: [html, cascadia, jsonschema, sqlite, goose]
  cmd:
    # Wiring only: it may assemble anything.
    anyProjectDeps: true
    anyVendorDeps: true
