[package]
name = "ascon-adblock"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ascon_adblock"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
uniffi = { version = "=0.32.2", features = ["cli"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
