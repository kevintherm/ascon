# Step 5: opening a chapter of a series in the library detects it and saves progress.
# Pages come from maestro/serve.py, built from the Madara theme fixture.
appId: com.ascon.app
---
- launchApp:
    clearState: true
    arguments:
      url: "http://10.0.2.2:8765/manga/aztec-turning-of-heaven/chapter-14/"
- extendedWaitUntil:
    visible: "DETECTED · IN YOUR LIBRARY"
    timeout: 15000
- assertVisible: "Aztec Turning of Heaven"
- assertVisible: "Chapter 14 · progress saved"
# The site's own Next link loads chapter 15, and the card follows the page.
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Chapter 15 · progress saved"
    timeout: 15000
# Back walks the page history before it leaves the browser.
- back
- extendedWaitUntil:
    visible: "Chapter 14 · progress saved"
    timeout: 15000
# Going back to chapter 14 does not move progress back from 15. Chapter 15 was new to the
# library and is added. Pages are unknown until the reader in step 6, so the button says Start.
- tapOn: "Open series"
- assertVisible: "Start Ch. 15"
- assertVisible: "15 chapters"
