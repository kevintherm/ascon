# Step 5: the browser stops pages from leaving the app, installing apps or redirecting on their own.
# A tap only takes the tab to another site through the link that was tapped.
appId: com.ascon.app
---
- launchApp:
    clearState: true
    arguments:
      url: "http://10.0.2.2:8765/"
- extendedWaitUntil:
    visible: "Open another app"
    timeout: 15000
- tapOn: "Open another app"
- assertVisible: "Stopped this page from opening another app"
- tapOn: "Download the reader app"
- assertVisible: "Blocked an app download"
- tapOn: "Next page with a hijacked tap"
- extendedWaitUntil:
    visible: "Stopped a redirect to 127.0.0.1"
    timeout: 15000
- assertVisible: "Ascon test site"
- tapOn: "Go to another site"
- extendedWaitUntil:
    visible: "Another test site"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Page that redirects by itself"
    timeout: 15000
- tapOn: "Page that redirects by itself"
- extendedWaitUntil:
    visible: "Stopped a redirect to 127.0.0.1"
    timeout: 15000
- assertVisible: "This page tries to leave for another site without a tap."
# Back walks the history, then closes the browser.
- back
- assertVisible: "Ascon test site"
- back
- assertVisible: "Continue reading"
