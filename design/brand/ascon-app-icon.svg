<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Ascon app icon</title>
  <defs>
    <linearGradient id="ground" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2A2C33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5.5" fill="#FFFFFF" fill-opacity="0.14"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0.15" y2="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
