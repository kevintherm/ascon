  <g transform="translate(192 192) scale(6.4)">
    <path d="M24 84 L50 18 L76 84" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 63 H61" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>
    <path d="M39 63 H51" stroke="url(#crossbar)" stroke-width="10" stroke-linecap="round"/>
