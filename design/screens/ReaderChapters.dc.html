<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9472B","options":["#D9472B","#2F55E4","#E08A00","#15161A"]},"accent2":{"editor":"color","default":"#F5A54A","section":"Gradient start"},"$preview":{"width":390,"height":844}}'>
