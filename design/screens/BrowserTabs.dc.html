<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser tabs</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15161A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15161A">

<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Tabs</h1>
<button style="height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #15161A; cursor: pointer">Close all</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #E6E8EC">
<button style="height: 40px; border: 0; border-radius: 12px; background: #fff; font: inherit; font-size: 14px; font-weight: 700; color: #15161A; cursor: pointer; box-shadow: 0 1px 3px rgba(21,22,26,0.08)">Open · 3</button>
<button style="height: 40px; border: 0; border-radius: 12px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #5B5F69; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><path d="M4 4l16 16"></path></svg>Private</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<div style="background: #fff; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 8px; outline: 2px solid #15161A; outline-offset: -2px">
<div style="height: 180px; border-radius: 12px; background: linear-gradient(180deg, #E8E4DC, #B9B09E); position: relative; overflow: hidden">
<div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,0.16) 1px, transparent 1.5px); background-size: 6px 6px"></div>
<span style="position: absolute; left: 6px; bottom: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(21,22,26,0.85); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>Ch. 12</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px 2px 4px">
<span style="width: 20px; height: 20px; border-radius: 6px; background: #E6E8EC; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">MF</span>
<span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mangafire.to</span>
<button aria-label="Close tab" style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #5B5F69; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>

<div style="background: #fff; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 180px; border-radius: 12px; background: #fff; border: 1px solid #ECEEF1; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px">
<div style="height: 10px; width: 70%; border-radius: 5px; background: #E6E8EC"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div style="aspect-ratio: 2 / 3; border-radius: 6px; background: linear-gradient(170deg, #9FB6D8, #3C4F7A)"></div>
<div style="aspect-ratio: 2 / 3; border-radius: 6px; background: linear-gradient(170deg, #D9D2B0, #8C7A4A)"></div>
<div style="aspect-ratio: 2 / 3; border-radius: 6px; background: linear-gradient(170deg, #C7B2E0, #6A4C93)"></div>
</div>
<div style="height: 8px; width: 50%; border-radius: 4px; background: #ECEEF1"></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px 2px 4px">
<span style="width: 20px; height: 20px; border-radius: 6px; background: #E6E8EC; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">MD</span>
<span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mangadex.org</span>
<button aria-label="Close tab" style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #5B5F69; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>

<div style="background: #fff; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 180px; border-radius: 12px; background: #15161A; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #fff; color: #15161A; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">M+</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px 2px 4px">
<span style="width: 20px; height: 20px; border-radius: 6px; background: #15161A; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">M+</span>
<span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">MANGA Plus</span>
<button aria-label="Close tab" style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #5B5F69; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>

</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; gap: 8px">
<a href="Browser.dc.html" style="flex: 1; height: 56px; border-radius: 28px; background: #15161A; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 30px rgba(21,22,26,0.28)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New tab</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9472B","options":["#D9472B","#2F55E4","#E08A00","#15161A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9472B' };
  }
}
</script>
</body>
</html>
