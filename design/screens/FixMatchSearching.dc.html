<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fix detection searching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15161A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1B1C20; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15161A">

<div style="position: absolute; inset: 0; background: linear-gradient(180deg, #E8E4DC 0%, #B9B09E 100%)">

</div>
<div style="position: absolute; inset: 0; background: rgba(14,15,18,0.55)"></div>

<div style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
<div style="flex: none; padding: 10px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #D5D8DE; align-self: center"></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<div style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">What are you reading?</div>
<div style="font-size: 14px; color: #5B5F69">We read this as Chapter 12. Pick the series it belongs to.</div>
</div>
<label style="height: 48px; border-radius: 12px; background: #F3F4F6; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 14px; color: #5B5F69; box-shadow: inset 0 0 0 2px #15161A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="text" value="tower of glass" aria-label="Search series" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #15161A">
<span role="img" aria-label="Searching" style="width: 44px; height: 44px; color: #15161A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#D5D8DE"></circle><path d="M12 4a8 8 0 0 1 8 8" stroke="currentColor"></path></svg></span>
</label>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #5B5F69">SEARCHING</span>
<span style="font-size: 12px; font-weight: 500; color: #5B5F69">AniList and MangaUpdates</span>
</div>

<div aria-hidden="true" style="border-radius: 16px; background: #F3F4F6; padding: 12px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 56px; flex: none; border-radius: 4px; background: #E6E8EC"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 70%; height: 12px; border-radius: 6px; background: #E6E8EC"></span><span style="width: 45%; height: 10px; border-radius: 5px; background: #E6E8EC"></span></span>
</div>
<div aria-hidden="true" style="border-radius: 16px; background: #F3F4F6; padding: 12px; display: flex; align-items: center; gap: 12px; opacity: 0.7">
<span style="width: 40px; height: 56px; flex: none; border-radius: 4px; background: #E6E8EC"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 58%; height: 12px; border-radius: 6px; background: #E6E8EC"></span><span style="width: 38%; height: 10px; border-radius: 5px; background: #E6E8EC"></span></span>
</div>
<div aria-hidden="true" style="border-radius: 16px; background: #F3F4F6; padding: 12px; display: flex; align-items: center; gap: 12px; opacity: 0.45">
<span style="width: 40px; height: 56px; flex: none; border-radius: 4px; background: #E6E8EC"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 64%; height: 12px; border-radius: 6px; background: #E6E8EC"></span><span style="width: 30%; height: 10px; border-radius: 5px; background: #E6E8EC"></span></span>
</div>

<button style="border: 2px dashed #C9CDD4; border-radius: 16px; background: #fff; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 40px; height: 56px; flex: none; border-radius: 6px; background: #ECEEF1; color: #5B5F69; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">None of these</span><span style="font-size: 12px; color: #5B5F69">Keep it as its own series</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CDD4; box-sizing: border-box; flex: none"></span>
</button>

<div style="display: flex; align-items: center; gap: 12px; padding: 6px 4px 0 4px">
<span style="flex: 1; font-size: 15px; font-weight: 600">Chapter</span>
<div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 16px; background: #F3F4F6">
<button aria-label="Previous chapter number" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #fff; color: #15161A; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer">−</button>
<span style="width: 56px; text-align: center; font-size: 18px; font-weight: 800">12</span>
<button aria-label="Next chapter number" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #fff; color: #15161A; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer">+</button>
</div>
</div>
</div>

<div style="flex: none; display: flex; gap: 8px; padding: 12px 16px 28px 16px; border-top: 1px solid #ECEEF1; background: #fff">
<button style="height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: #F3F4F6; color: #15161A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Not a comic</button>
<button disabled style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: #E6E8EC; color: #5B5F69; font: inherit; font-size: 16px; font-weight: 700">Save</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }
}
</script>

</html>
