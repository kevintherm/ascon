<x-dc>

<style>

</helmet>

<input type="text" value="aztec turning" aria-label="Search series" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #15161A">
<button aria-label="Clear search" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B5F69; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</label>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #5B5F69">4 RESULTS</span>
<span style="font-size: 12px; font-weight: 500; color: #5B5F69">AniList and MangaUpdates</span>
</div>

<button style="border: 2px solid #15161A; border-radius: 16px; background: #fff; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Aztec Turning of Heaven</span><span style="font-size: 12px; color: #5B5F69">AniList · Manga · 2025</span><span style="font-size: 12px; font-weight: 600; color: #15161A">In your library</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; background: #15161A; color: #fff; display: flex; align-items: center; justify-content: center; flex: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
</button>

<button style="border: 2px solid transparent; border-radius: 16px; background: #F3F4F6; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 40px; height: 56px; flex: none; border-radius: 6px; background: linear-gradient(170deg, #C9B79C, #7C6A4E 60%, #2A2218)"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Aztec Turning: Side Stories</span><span style="font-size: 12px; color: #5B5F69">AniList · One-shot collection · 2025</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CDD4; box-sizing: border-box; flex: none"></span>
</button>

<button style="border: 2px solid transparent; border-radius: 16px; background: #F3F4F6; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 40px; height: 56px; flex: none; border-radius: 6px; background: linear-gradient(170deg, #9DB8C9, #3E5D74 60%, #141E2A)"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Turning of the Heavens</span><span style="font-size: 12px; color: #5B5F69">MangaUpdates · Manhwa · 2022</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CDD4; box-sizing: border-box; flex: none"></span>
</button>

<button style="border: 2px solid transparent; border-radius: 16px; background: #F3F4F6; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 40px; height: 56px; flex: none; border-radius: 6px; background: linear-gradient(170deg, #B7C99D, #5E7444 60%, #1C2414)"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">The Aztec Turning</span><span style="font-size: 12px; color: #5B5F69">AniList · Light novel · 2021</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CDD4; box-sizing: border-box; flex: none"></span>
</button>

<button style="border: 2px dashed #C9CDD4; border-radius: 16px; background: #fff; padding: 10px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 40px; height: 56px; flex: none; border-radius: 6px; background: #ECEEF1; color: #5B5F69; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">None of these</span><span style="font-size: 12px; color: #5B5F69">Keep it as its own series</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CDD4; box-sizing: border-box; flex: none"></span>
</button>

<div style="display: flex; align-items: center; gap: 12px; padding: 6px 4px 0 4px">
<span style="flex: 1; font-size: 15px; font-weight: 600">Chapter</span>
<div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 16px; background: #F3F4F6">
<button aria-label="Previous chapter number" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #fff; color: #15161A; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer">−</button>
<span style="width: 56px; text-align: center; font-size: 18px; font-weight: 800">12</span>
<button aria-label="Next chapter number" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #fff; color: #15161A; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer">+</button>
</div>
</div>
</div>

<div style="flex: none; display: flex; gap: 8px; padding: 12px 16px 28px 16px; border-top: 1px solid #ECEEF1; background: #fff">
<button style="height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: #F3F4F6; color: #15161A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Not a comic</button>
<button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: {{accent}}; color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Save</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9472B","options":["#D9472B","#2F55E4","#E08A00","#15161A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9472B' };
  }
}
</script>
</body>
</html>
