<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15161A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15161A">

<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Library</h1>
<div style="display: flex; gap: 8px">
<button aria-label="Search library" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #fff; color: #15161A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button aria-label="Sort and view" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #fff; color: #15161A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg></button>
</div>
</div>

<div style="display: flex; gap: 8px; overflow: hidden">
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #15161A; color: #fff; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">Reading · 12</button>
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #E6E8EC; color: #15161A; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">Plan · 8</button>
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #E6E8EC; color: #15161A; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">Paused · 3</button>
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #E6E8EC; color: #15161A; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">Done · 41</button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #5B5F69; padding: 0 2px">
<span>Sorted by last read</span>
<span>12 series</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; background: {{item.cover}}">
<div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,0.2) 1px, transparent 1.4px); background-size: 5px 5px; opacity: 0.6"></div>
<sc-if value="{{item.hasNew}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: {{accent}}; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{item.newCount}}</span>
</sc-if>
<div style="position: absolute; left: 6px; right: 6px; bottom: 6px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); overflow: hidden"><div style="height: 100%; width: {{item.progress}}; background: #fff; border-radius: 2px"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{item.title}}</div>
<div style="font-size: 12px; color: #5B5F69">{{item.meta}}</div>
</div>
</div>
</sc-for>
</div>
</div>

<nav style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 68px; border-radius: 28px; background: #15161A; display: flex; align-items: center; justify-content: space-around; padding: 10px; box-sizing: border-box; box-shadow: 0 12px 30px rgba(21,22,26,0.28)">
<a href="Main.dc.html" aria-label="Home" style="width: 64px; height: 48px; border-radius: 18px; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"></path><path d="M10 20v-5h4v5"></path></svg></a>
<a href="#" aria-label="Library" style="width: 64px; height: 48px; border-radius: 18px; background: #fff; color: #15161A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="1.5"></rect><rect x="14" y="4" width="6" height="16" rx="1.5"></rect></svg></a>
<a href="Browser.dc.html" aria-label="Browse" style="width: 64px; height: 48px; border-radius: 18px; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m15 9-2 4-4 2 2-4z"></path></svg></a>
<a href="Settings.dc.html" aria-label="Settings" style="width: 64px; height: 48px; border-radius: 18px; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9472B","options":["#D9472B","#2F55E4","#E08A00","#15161A"]},"$preview":{"width":390,"height":844}}'>

    const items = [

      { title: 'The Last Lighthouse Keeper', meta: 'Ch. 47 of 48', cover: 'linear-gradient(170deg, #9FB6D8, #3C4F7A 60%, #1C2235)', progress: '96%', hasNew: true, newCount: '1' },

      { title: 'Moth & Lantern', meta: 'Ch. 15 of 31', cover: 'linear-gradient(170deg, #D6D6D6, #6B6B6B 60%, #1E1E1E)', progress: '48%', hasNew: false, newCount: '' }

  }
}
</script>
</body>
</html>
