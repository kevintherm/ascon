<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#fff}
</style>
</helmet>
<div aria-label="Web page, toolbar hidden" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1B1C20; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff; display: flex; flex-direction: column; gap: 6px">

<div style="flex: 1; min-height: 0; background: linear-gradient(180deg, #D7D2C8 0%, #B9B09E 100%); position: relative; overflow: hidden">
<div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1.5px); background-size: 6px 6px"></div>
<div style="position: absolute; left: 28px; top: 60px; width: 140px; height: 80px; border-radius: 44px; background: #fff; border: 2px solid #2A2A2A"></div>
<div style="position: absolute; right: 26px; top: 250px; width: 130px; height: 74px; border-radius: 40px; background: #fff; border: 2px solid #2A2A2A"></div>
</div>
<div style="flex: 1; min-height: 0; background: linear-gradient(180deg, #E8E4DC 0%, #C2BAAA 100%); position: relative; overflow: hidden">
<div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1.5px); background-size: 6px 6px"></div>
<div style="position: absolute; left: 50px; top: 90px; width: 150px; height: 84px; border-radius: 46px; background: #fff; border: 2px solid #2A2A2A"></div>
</div>
<div style="height: 56px; flex: none; margin-top: -6px; background: #2B2D33; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; color: #C9CDD4; font-size: 13px; font-weight: 600; text-align: center">
<span>‹ Prev</span><span>Chapter 12 ▾</span><span>Next ›</span>
</div>

<div role="progressbar" aria-label="Chapter progress" aria-valuenow="46" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; right: 0; top: 0; height: 2px; pointer-events: none"><div style="width: 46%; height: 100%; border-radius: 0 1px 1px 0; background: linear-gradient(90deg, {{accent2}}, {{accent}})"></div></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9472B","options":["#D9472B","#2F55E4","#E08A00","#15161A"]},"accent2":{"editor":"color","default":"#F5A54A","section":"Gradient start"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9472B', accent2: this.props.accent2 ?? '#F5A54A' };
  }
}
</script>
</body>
</html>
